id: tutor
name: Tutor
description: "Chat with a private tutor who knows your course material. Socratic by default: it asks, guides and cites."
icon: "🎓"
pack: core
kind: code
output: chat
tier: smart
inputs:
  - name: mode
    label: Mode
    type: select
    options: [socratic, direct, quiz-me, simple]
    default: socratic
retrieval: { mode: search }
authors: [TutorAI core team]
i18n:
  en:
    inputs:
      mode:
        options: { socratic: Socratic, direct: Direct explanation, quiz-me: Quiz me, simple: "Simply, like I'm 12" }
  he:
    name: מורה פרטי
    description: שיחה עם מורה פרטי שמכיר את חומר הקורס. מצב סוקרטי כברירת מחדל — שואל, מכוון ומצטט.
    inputs:
      mode:
        label: מצב
        options: { socratic: סוקרטי, direct: הסבר ישיר, quiz-me: בוחן אותי, simple: "בפשטות, כמו לילד בן 12" }
