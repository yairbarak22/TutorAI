id: quiz
name: Quiz
description: Multiple-choice and open questions with feedback and explanations. Updates your mastery tracking.
icon: "❓"
pack: core
kind: declarative
output: quiz
tier: smart
inputs:
  - { name: source, label: "Source", type: source, default: all }
  - { name: concept, label: "Concept (optional)", type: concept, default: "" }
  - { name: count, label: "Number of questions", type: number, default: 6 }
  - name: difficulty
    label: Difficulty
    type: select
    options: [basic, medium, challenging]
    default: medium
retrieval:
  mode: search
  query: "{{params.concept}}"
authors: [TutorAI core team]
i18n:
  en:
    inputs:
      difficulty:
        options: { basic: Basic, medium: Medium, challenging: Challenging }
  he:
    name: חידון
    description: שאלות אמריקאיות ופתוחות עם משוב והסבר — מעדכן את מעקב השליטה שלכם.
    inputs:
      source: { label: מקור }
      concept: { label: מושג (לא חובה) }
      count: { label: מספר שאלות }
      difficulty:
        label: רמת קושי
        options: { basic: בסיסית, medium: בינונית, challenging: מאתגרת }
