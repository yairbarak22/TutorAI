id: diagram
name: Diagram
description: A Mermaid diagram of a topic, such as a concept map, a decision flowchart or a timeline.
icon: "🗺️"
pack: core
kind: declarative
output: diagram
tier: smart
inputs:
  - { name: topic, label: "Topic", type: text, default: "", required: true }
  - name: style
    label: Diagram type
    type: select
    options: [concept-map, decision-flowchart, timeline]
    default: concept-map
retrieval:
  mode: search
  query: "{{params.topic}}"
authors: [RuecAI core team]
i18n:
  he:
    name: תרשים
    description: תרשים Mermaid, כמו מפת מושגים, תרשים זרימה להחלטה או ציר זמן.
    inputs:
      topic: { label: נושא }
      style:
        label: סוג תרשים
        options: { concept-map: מפת מושגים, decision-flowchart: תרשים זרימה להחלטה, timeline: ציר זמן }
