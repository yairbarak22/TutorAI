id: summary
name: Summary
description: A structured summary of a lecture, file or topic, with a citation for every claim.
icon: "📝"
pack: core
kind: declarative
output: markdown_doc
tier: smart
inputs:
  - { name: source, label: "Source", type: source, default: all }
  - { name: focus, label: "Focus topic (optional)", type: text, default: "" }
  - name: length
    label: Length
    type: select
    options: [concise, medium, detailed]
    default: medium
retrieval:
  mode: search
  query: "{{params.focus}}"
authors: [RuecAI core team]
i18n:
  he:
    name: סיכום
    description: סיכום מסודר של הרצאה, קובץ או נושא — עם ציטוט לכל טענה.
    inputs:
      source: { label: מקור }
      focus: { label: נושא ממוקד (לא חובה) }
      length:
        label: אורך
        options: { concise: תמציתי, medium: בינוני, detailed: מפורט }
