id: worked-example
name: Worked example
description: A new exercise with a step-by-step solution, graded hints and a sanity check, for quantitative courses.
icon: "🧮"
pack: math
kind: declarative
output: markdown_doc
tier: smart
disciplines: [math, cs, economics]
inputs:
  - { name: concept, label: "Concept", type: concept, default: "" }
  - name: difficulty
    label: Difficulty
    type: select
    options: [basic, medium, challenging]
    default: medium
retrieval:
  mode: search
  query: "{{params.concept}}"
authors: [RuecAI math pack]
i18n:
  en:
    inputs:
      difficulty:
        options: { basic: Basic, medium: Medium, challenging: Challenging }
  he:
    name: פתרון מודרך
    description: תרגיל חדש עם פתרון צעד אחר צעד, רמזים מדורגים ובדיקת סבירות — לקורסים כמותיים.
    inputs:
      concept: { label: מושג }
      difficulty:
        label: רמת קושי
        options: { basic: בסיסית, medium: בינונית, challenging: מאתגרת }
