id: case-brief
name: Case analysis (IRAC)
description: Analyzes a legal problem in IRAC form (issue, rule, application, conclusion), grounded in the statutes and course material.
icon: "⚖️"
pack: law
kind: declarative
output: markdown_doc
tier: smart
disciplines: [law]
inputs:
  - { name: facts, label: "Facts of the case / question", type: textarea, default: "", required: true }
retrieval:
  mode: search
  query: "{{params.facts}}"
authors: [TutorAI law pack]
i18n:
  he:
    name: ניתוח שאלת אירוע (IRAC)
    description: ניתוח סוגיה משפטית במבנה IRAC — סוגיה, כלל, יישום, מסקנה — מעוגן בחקיקה ובחומר הקורס.
    inputs:
      facts: { label: עובדות המקרה / השאלה }
