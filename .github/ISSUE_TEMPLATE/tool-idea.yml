name: 💡 New tool idea
description: A study tool you'd like to have (even if you can't code!)
labels: [plugin-idea]
body:
  - type: input
    id: course
    attributes: { label: Which course or field?, placeholder: "Contract law, Intro to Economics, Data Structures…" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What does the tool do?, description: "What you upload, and what you get at the end" }
    validations: { required: true }
  - type: textarea
    id: example
    attributes: { label: Example of good output, description: What you'd like the result to look like }
