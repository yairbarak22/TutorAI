name: 🐞 Bug
description: Something isn't working as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What you did and what you expected to happen }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and operating system, placeholder: "Chrome 140 / macOS" }
  - type: textarea
    id: error
    attributes: { label: Error message (if one appeared), render: text }
