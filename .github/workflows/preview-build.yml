# Stage 1 of PR previews: build the PR (untrusted code) with NO secrets and a read-only token.
name: Preview build
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { VITE_PREVIEW: "1" }
      - run: echo "${{ github.event.pull_request.number }}" > apps/web/dist/.pr-number
      - uses: actions/upload-artifact@v4
        with: { name: preview-site, path: apps/web/dist, include-hidden-files: true, retention-days: 7 }
