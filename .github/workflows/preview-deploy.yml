# Stage 2 of PR previews: deploy the built static files to Cloudflare Pages.
# Each preview gets its OWN origin (xyz.ruecai.pages.dev), so a malicious PR can never read
# data or API keys stored by the real site. Requires repo secrets:
#   CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID — see docs/maintainers.md.
name: Preview deploy
on:
  workflow_run:
    workflows: ["Preview build"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: pr
        run: |
          n=$(tr -cd '0-9' < site/.pr-number)
          echo "number=$n" >> "$GITHUB_OUTPUT"
          rm site/.pr-number
      - name: Deploy to Cloudflare Pages
        id: cf
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ruecai-previews --branch=pr-${{ steps.pr.outputs.number }}
      - name: Comment preview link on the PR
        if: env.CF_TOKEN != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.cf.outputs.deployment-url }}`;
            const body = `🔎 **תצוגה מקדימה של השינוי:** ${url}\n\nבתצוגה המקדימה השתמשו ב**מצב הדגמה** בלבד, בלי מפתח API אמיתי.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(`${{ steps.pr.outputs.number }}`), body });
